<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Rio Bistrô Saudável · Cardápio Digital</title>
<style>
:root{
 --green:#5b7b3b; --green-dk:#3f5a26; --green-lt:#e9efe2; --deep:#02883f;
 --lime:#c9d62b; --cream:#f8f9f2; --ink:#18221c; --ink2:#3c4a3c; --muted:#627454;
 --card:#ffffff; --line:#e3e8da; --price:#5b7b3b; --gold:#d89325;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:"DejaVu Sans",Verdana,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* barra do topo */
.top{position:sticky;top:0;z-index:60;background:var(--green-dk);color:#fff;box-shadow:0 2px 12px rgba(24,34,28,.16)}
.topin{display:flex;align-items:center;gap:10px;padding:9px 14px;max-width:1180px;margin:0 auto;min-height:60px}
.topin .logo{height:40px;width:auto;background:#fff;border-radius:9px;padding:3px 5px}
.topin .tt{flex:1;min-width:0;line-height:1.15}
.topin .tt b{display:block;color:#fff;font-size:15.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topin .tt span{display:block;color:var(--lime);font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;margin-top:2px}
.cartbtn{position:relative;display:flex;align-items:center;gap:7px;background:var(--lime);color:#243300;border-radius:999px;padding:9px 14px;font-weight:bold;font-size:13px;white-space:nowrap}
.cartbtn svg{width:17px;height:17px}
.cartbtn .cnt{background:#243300;color:var(--lime);border-radius:999px;min-width:19px;height:19px;display:none;align-items:center;justify-content:center;font-size:11px;padding:0 5px}
.cartbtn .cnt.on{display:inline-flex}

/* busca */
.searchwrap{background:var(--cream);border-bottom:1px solid var(--line)}
.searchin{max-width:1180px;margin:0 auto;padding:12px 14px}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:0 1px 4px rgba(24,34,28,.04)}
.search svg{width:17px;height:17px;color:var(--muted);flex:0 0 17px}
.search input{border:0;outline:0;font-family:inherit;font-size:14.5px;color:var(--ink);flex:1;min-width:0;background:transparent}
.search button{color:var(--muted);font-size:18px;line-height:1;padding:0 2px}

/* categorias */
.nav{position:sticky;top:60px;z-index:55;background:var(--cream);border-bottom:1px solid var(--line)}
.navin{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--green);font-weight:bold;font-size:12.5px;border-radius:999px;padding:8px 14px}
.chip.on{background:var(--green-dk);border-color:var(--green-dk);color:#fff;box-shadow:0 4px 12px rgba(63,90,38,.25)}

/* conteudo */
.wrap{max-width:1180px;margin:0 auto}
.cathead{padding:16px 14px 10px}
.cathead h2{margin:0;font-size:20px;color:var(--green-dk);line-height:1.2}
.cathead p{margin:6px 0 0;color:var(--ink2);font-size:12.5px;max-width:640px}
.count{display:inline-block;margin:9px 0 0;color:var(--muted);font-size:11px;font-weight:bold;letter-spacing:.6px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 14px 22px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(24,34,28,.06)}
.thumb{position:relative;aspect-ratio:4/3;background:var(--green-lt);overflow:hidden;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[data-det]{display:flex;width:auto;padding:0;text-align:inherit;cursor:pointer}
.thumb[data-det]:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.mvideo{display:block;width:100%;height:min(62vh,720px);object-fit:contain;background:#111}
.thumb.ph{background:
   radial-gradient(circle at 22% 24%,rgba(201,214,43,.55),transparent 42%),
   radial-gradient(circle at 82% 78%,rgba(2,136,63,.35),transparent 46%),
   linear-gradient(135deg,#eef2e6,#dbe6cd)}
.thumb.ph .phl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4c6b31;font-weight:bold;font-size:34px;opacity:.5}
.catbadge{position:absolute;left:8px;bottom:8px;background:rgba(24,34,28,.82);color:#fff;font-size:9px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;padding:3px 8px;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1}
.cbody h3{margin:0;font-size:14px;color:var(--ink);line-height:1.25}
.desc{margin:6px 0 0;color:var(--ink2);font-size:12.2px;line-height:1.4;flex:1}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.bdg{display:inline-flex;align-items:center;gap:4px;border:1px solid #cfdcbd;background:#f4f7ee;color:var(--green-dk);border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:bold}
.bdg svg{width:12px;height:12px}
.bdg.sea{border-color:#cfe0e6;background:#eef6f8;color:#1d5f70}
.cfoot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px}
.price{color:var(--price);font-weight:bold;font-size:15px;white-space:nowrap}
.det{color:var(--gold);font-weight:bold;font-size:10.5px;white-space:nowrap}
.det:active{opacity:.55}
.add{margin-top:9px;background:var(--green);color:#fff;font-weight:bold;font-size:12.5px;border-radius:10px;padding:9px 10px;width:100%}
.add:active{background:var(--green-dk)}
.add.in{background:var(--green-lt);color:var(--green-dk);border:1px solid #cfdcbd}
.empty{padding:26px 18px 40px;color:var(--muted);font-size:13.5px;text-align:center}

/* montagem */
.builder{margin:0 14px 20px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bhero{display:flex;gap:12px;padding:12px;align-items:center;background:linear-gradient(90deg,#f4f7ee,#fff)}
.bhero img{width:96px;height:76px;object-fit:cover;border-radius:9px;flex:0 0 96px}
.bhero h3{margin:0;color:var(--green);font-size:15.5px}
.bhero p{margin:4px 0 0;color:var(--ink2);font-size:12.4px}
.bstep{border-top:1px solid var(--line);padding:11px 12px}
.bstep .lb{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bstep .lb b{color:var(--green);font-size:13px;text-transform:uppercase;letter-spacing:.3px}
.bstep .lb i{color:var(--muted);font-size:11.5px;font-style:normal}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.opt{border:1px solid #d7dfc9;background:#fff;color:var(--ink);border-radius:999px;padding:7px 11px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.opt small{color:var(--muted);font-size:11px}
.opt.on{background:var(--green);border-color:var(--green);color:#fff}
.opt.on small{color:#e7f0d8}
.opt .sea{color:#1d5f70}
.opt.on .sea{color:#d8f1f7}
.bfoot{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px;background:#f7f9f2;border-top:1px solid var(--line)}
.btot{color:var(--green);font-weight:bold;font-size:15px}
.btot small{display:block;color:var(--muted);font-weight:normal;font-size:11px}
.bfoot .add{width:auto;padding:10px 16px;margin:0}

/* detalhes */
.modal{position:fixed;left:0;right:0;bottom:0;z-index:96;background:var(--cream);border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(103%);transition:transform .26s cubic-bezier(.3,.8,.3,1)}
.modal.on{transform:none}
.mimg{width:100%;height:210px;object-fit:cover;background:var(--green-lt)}
.mwrap{padding:14px 16px 20px}
.mcat{margin:0;color:var(--muted);font-size:10.5px;font-weight:bold;letter-spacing:.7px;text-transform:uppercase}
.mwrap h2{margin:5px 0 0;font-size:20px;color:var(--green-dk);line-height:1.2}
.mwrap .desc{font-size:13.5px;margin-top:10px;flex:none}
.mprice{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.mprice .price{font-size:22px}
.mprice .add{width:auto;padding:12px 16px;margin:0}
.mx{position:absolute;top:10px;right:12px;background:rgba(24,34,28,.72);color:#fff;width:32px;height:32px;border-radius:999px;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}

/* carrinho */
.fab{position:fixed;right:14px;bottom:16px;z-index:80;background:var(--green);color:#fff;border-radius:999px;padding:14px 18px;display:flex;align-items:center;gap:9px;font-weight:bold;box-shadow:0 8px 22px rgba(63,90,38,.35)}
.fab svg{width:20px;height:20px}
.fab .cnt{background:var(--lime);color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
.mask{position:fixed;inset:0;background:rgba(24,34,28,.45);z-index:90;opacity:0;pointer-events:none;transition:.22s}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--cream);border-radius:16px 16px 0 0;max-height:86vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dhead b{color:var(--green);font-size:16px}
.dhead .x{font-size:22px;color:var(--muted);padding:0 4px;line-height:1}
.ditems{overflow-y:auto;padding:8px 12px;flex:1}
.dit{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.dit .im{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:0 0 52px;background:var(--green-lt)}
.dit .in{flex:1;min-width:0}
.dit .in b{display:block;color:var(--green);font-size:13.5px}
.dit .in small{display:block;color:var(--muted);font-size:11.3px;margin-top:2px}
.dit .in .pp{color:var(--price);font-weight:bold;font-size:13px;margin-top:4px;display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid #cfdcbd;background:#f4f7ee;color:var(--green-dk);font-weight:bold;font-size:15px;line-height:1}
.qty span{min-width:20px;text-align:center;font-weight:bold;font-size:13.5px}
.dempty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.dfoot{border-top:1px solid var(--line);padding:12px 14px 16px;background:#fff}
.trow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.trow b{color:var(--green);font-size:15px}
.trow .tot{color:var(--green);font-weight:bold;font-size:20px}
.dact{display:flex;gap:9px}
.dact button{flex:1;border-radius:10px;padding:12px;font-weight:bold;font-size:13.5px}
.wa{background:#1faf54;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.wa svg{width:18px;height:18px}
.cl{background:#eef2e7;color:var(--green-dk);border:1px solid #cfdcbd !important}
.note{color:var(--muted);font-size:11px;text-align:center;margin:8px 0 0}

/* rodape */
footer{margin-top:22px;background:var(--green-dk);color:#fff}
.ftin{max-width:1180px;margin:0 auto;padding:20px 14px 104px}
.fbrand{display:flex;align-items:center;gap:11px}
.fbrand img{height:42px;width:auto;background:#fff;border-radius:9px;padding:3px 5px}
.fbrand b{display:block;font-size:15.5px}
.fbrand small{display:block;color:var(--lime);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:flex-start;color:#e7f0d8;font-size:12px;font-weight:bold;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cred{margin-top:16px;color:#fff;font-weight:bold;font-size:13px}
.cred small{display:block;color:#cfe0b8;font-weight:normal;font-size:11.5px;margin-top:2px}
.ig{margin-top:10px;color:var(--lime);font-size:12.5px;font-weight:bold}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:96px;background:var(--green-dk);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:bold;z-index:120;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== REDESIGN VISUAL ===== */
/* Redesign Rio Bistrô Saudável — camada visual, preservando markup e lógica originais */
:root{
  --green:#5f7f43;
  --green-dk:#405b2a;
  --green-lt:#e9eee3;
  --sage:#a9b89a;
  --lime:#dce6a8;
  --cream:#f6f5ec;
  --ink:#33382f;
  --ink2:#596052;
  --muted:#737968;
  --card:#fff;
  --line:#e5e4d9;
  --price:#405b2a;
  --gold:#9a793d;
  color-scheme:light;
}
html,body{max-width:100%;overflow-x:clip}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,"Aptos",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input{font:inherit}
button{touch-action:manipulation}
.top{background:var(--green-dk);box-shadow:0 3px 14px rgba(31,43,23,.13)}
.topin{max-width:1240px;min-height:58px;padding:8px 20px;gap:12px}
.topin .logo{height:40px;max-width:70px;object-fit:contain;border-radius:8px;padding:3px 5px}
.topin .tt b{font-size:15px;letter-spacing:.1px}
.topin .tt span{font-size:10px;letter-spacing:.8px;color:#dce6a8}
.cartbtn{min-height:40px;background:#dce6a8;color:#30431e;padding:8px 13px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.searchwrap{background:var(--cream);border-color:var(--line)}
.searchin{max-width:1240px;padding:10px 20px 9px}
.search{gap:9px;border-color:#e4e4d9;border-radius:12px;padding:9px 12px;box-shadow:0 2px 8px rgba(40,49,31,.035)}
.search:focus-within{border-color:var(--sage);box-shadow:0 0 0 3px rgba(169,184,154,.2)}
.search input{font-size:13.5px}
.nav{top:58px;background:rgba(246,245,236,.96);border-color:var(--line);backdrop-filter:blur(12px)}
.navin{max-width:1240px;gap:7px;padding:8px 20px;scroll-snap-type:x proximity}
.chip{border-color:#e3e5d8;background:#fff;color:var(--green-dk);font-size:11.5px;padding:7px 12px;scroll-snap-align:start;transition:background .18s ease,color .18s ease,border-color .18s ease}
.chip.on{background:var(--green-dk);border-color:var(--green-dk);box-shadow:0 2px 7px rgba(64,91,42,.18)}
.wrap{max-width:1240px}
.cathead{padding:23px 20px 13px;text-align:center}
.cathead h2{display:flex;align-items:center;justify-content:center;gap:13px;font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.12;letter-spacing:.1px;color:var(--green-dk)}
.cathead h2:before,.cathead h2:after{content:"";flex:1 1 auto;max-width:180px;border-top:1px solid var(--sage)}
.cathead p{font-size:11.5px;color:var(--ink2);max-width:720px;margin-left:auto;margin-right:auto;letter-spacing:.11em;text-transform:uppercase}
.count{display:block;font-size:10px;letter-spacing:.75px;color:var(--muted);margin-top:7px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 20px 24px}
.card{background:#faf9f0;border:1px solid rgba(64,91,42,.24);border-radius:14px;box-shadow:none;transition:transform .18s ease,border-color .18s ease}
@media (hover:hover){.card:hover{transform:translateY(-2px);border-color:rgba(64,91,42,.48)}}
.thumb{aspect-ratio:1.22/1;background:#f0f0e8}
.thumb img{object-fit:contain;padding:3px}
.thumb.ph{background:radial-gradient(circle at 22% 24%,rgba(169,184,154,.3),transparent 42%),radial-gradient(circle at 82% 78%,rgba(95,127,67,.16),transparent 46%),linear-gradient(135deg,#f4f3e9,#e6e9dd)}
.thumb.ph .phl{color:var(--green-dk);font-size:30px;opacity:.42}
.catbadge{left:9px;bottom:9px;background:rgba(51,56,47,.82);font-size:9px;letter-spacing:.45px;padding:4px 8px}
.cbody{padding:10px 11px 12px}
.product-head{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.product-head h3{flex:1;min-width:0;margin:0}
.product-head .price{flex:0 0 auto;white-space:nowrap;margin-top:1px}
.cbody h3{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.2;letter-spacing:.05px;color:var(--green-dk)}
.desc{margin-top:5px;color:var(--ink2);font-size:11.5px;line-height:1.42}
.badges{gap:4px;margin-top:8px}
.bdg{border-color:#dbe3d3;background:#f4f6f0;color:var(--green-dk);padding:3px 6px;font-size:9.5px}
.bdg svg{flex:0 0 12px}
.bdg.sea{border-color:#d9e5e6;background:#f1f7f7;color:#375f62}
.cfoot{gap:5px;margin-top:7px;align-items:center;justify-content:flex-end}
.price{font-family:Georgia,"Times New Roman",serif;color:var(--price);font-size:15px;letter-spacing:-.15px}
.det{font-size:10px;color:var(--green);text-decoration:underline;text-underline-offset:2px}
.add{min-height:40px;margin-top:8px;background:var(--green);border-radius:9px;font-size:11px;padding:9px 8px;letter-spacing:.02px;transition:background .15s ease,transform .15s ease}
.add:hover{background:var(--green-dk)}
.add:active{transform:scale(.985)}
.add.in{background:var(--green-lt);color:var(--green-dk);border-color:#d5dfca}
.empty{padding:28px 18px 42px;color:var(--muted)}
.builder{margin:0 20px 22px;border-color:var(--line);border-radius:16px;box-shadow:0 3px 12px rgba(45,53,37,.05)}
.bhero{gap:14px;padding:14px;background:linear-gradient(110deg,#eff2e9,#fff)}
.bhero img{width:96px;height:76px;border-radius:10px;background:#f0f0e8}
.bhero h3{color:var(--green-dk);font-size:15px}
.bhero p{color:var(--ink2);font-size:12px}
.bstep{border-color:var(--line);padding:12px 14px}
.bstep .lb b{color:var(--green-dk);font-size:11.5px;letter-spacing:.55px}
.bstep .lb i{font-size:10.5px}
.opts{gap:7px;margin-top:9px}
.opt{border-color:#dfe3d7;border-radius:999px;padding:7px 10px;font-size:11.5px}
.opt.on{background:var(--green);border-color:var(--green)}
.bfoot{background:#f2f3eb;border-color:var(--line);padding:12px 14px}
.btot{color:var(--green-dk);font-size:14px}
.bfoot .add{font-size:11px}
.modal{background:var(--cream);box-shadow:0 -8px 34px rgba(31,43,23,.16)}
.modal.on{transform:none}
.mimg{height:clamp(190px,36vh,320px);object-fit:contain;background:#eeefe7;padding:6px}
.mwrap{padding:15px 18px 22px}
.mcat{color:var(--muted);font-size:10px;letter-spacing:.85px}
.mwrap h2{color:var(--green-dk);font-size:21px;letter-spacing:-.35px}
.mwrap .desc{font-size:13px;line-height:1.55}
.mprice .price{font-size:21px}
.mx{top:12px;right:13px;width:36px;height:36px;background:rgba(51,56,47,.76)}
.fab{right:20px;bottom:20px;z-index:80;background:var(--green-dk);box-shadow:0 7px 20px rgba(48,67,30,.25);padding:12px 16px;font-size:13px}
.fab .cnt{background:#dce6a8;color:#30431e}
.fabtotal{display:none}

/* Atualização de cards e carrinho-resumo */
/* Novo padrão de cards inspirado na referência do Piauiense, preservando a identidade Rio */
.grid{display:flex;flex-direction:column;gap:14px;padding:0 clamp(12px,3vw,24px) 28px}
.card{display:flex;align-items:stretch;min-height:230px;overflow:hidden;border:1px solid rgba(64,91,42,.24);border-radius:18px;background:#f0f3e9;box-shadow:0 7px 20px rgba(47,63,35,.08);transition:transform .18s ease,border-color .18s ease}
@media(hover:hover){.card:hover{transform:translateY(-2px);border-color:rgba(64,91,42,.52)}}
.card .thumb{position:relative;order:2;display:flex;flex:0 0 clamp(210px,34%,380px);align-items:center;justify-content:center;min-width:0;min-height:220px;height:auto;aspect-ratio:auto;padding:10px;background:#e8eddf}
.card .thumb img{width:100%;height:100%;max-height:260px;object-fit:contain;padding:2px}
.card .cbody{order:1;display:flex;flex:1;flex-direction:column;align-items:stretch;min-width:0;padding:18px 21px 17px}
.card:nth-child(odd){border-color:#405b2a;background:linear-gradient(116deg,#5f7f43 0%,#405b2a 100%);color:#fff}
.card:nth-child(odd) .thumb{background:rgba(255,255,255,.12)}
.card:nth-child(even) .thumb{order:0;background:#e8eddf}
.card .product-head{align-items:flex-start;gap:12px}
.card .product-head h3{font-size:clamp(18px,2vw,24px);line-height:1.12}
.card .product-head .price{font-size:clamp(16px,1.7vw,21px)}
.card .desc{flex:1;margin:10px 0 0;font-size:13px;line-height:1.5}
.card .badges{gap:6px;margin-top:12px}
.card .bdg{padding:4px 8px;font-size:10px}
.card .cfoot{justify-content:flex-start;margin-top:auto;padding-top:10px}
.card .det{font-size:11px}
.card .add{align-self:flex-start;width:auto;min-width:138px;min-height:44px;margin-top:9px;padding:10px 16px;border-radius:999px;font-size:12px;font-weight:800}
.card:nth-child(odd) .cbody h3{color:#fff}
.card:nth-child(odd) .price{color:#e3edb1}
.card:nth-child(odd) .desc{color:#f0f4e8}
.card:nth-child(odd) .det{color:#e6eddb}
.card:nth-child(odd) .bdg{border-color:rgba(255,255,255,.35);background:#f4f6f0;color:#405b2a}
.card:nth-child(odd) .bdg.sea{border-color:#d9e5e6;background:#f1f7f7;color:#375f62}
.card:nth-child(odd) .add{background:#dce6a8;color:#30431e}
.card:nth-child(odd) .add:hover{background:#eef4d1}

/* ---------- etiquetas ---------- */
function badgeHTML(b){
  if(!b || !b.length) return '';
  return b.map(t=>{
    if(t==='sea') return '<span class="bdg sea">'+fish+'Frutos do mar</span>';
    if(t==='sl') return '<span class="bdg">'+milk+'Sem lactose</span>';
    return '<span class="bdg">'+wheat+'Sem glúten</span>';
  }).join('');
}

/* ---------- card ---------- */
function thumbHTML(it, badge){
  const src = IMG[it.img] || (it.simg && IMG[it.simg]) || '';
  const b = badge ? '<span class="catbadge">'+esc(badge)+'</span>' : '';
  const open = ' type="button" data-det="'+esc(it.id)+'" aria-label="Ver detalhes de '+esc(it.n)+'"';
  if(src) return '<button class="thumb"'+open+'><img src="'+src+'" alt="" loading="lazy">'+b+'</button>';
  return '<button class="thumb ph"'+open+'><span class="phl">'+esc(it.n.trim().charAt(0).toUpperCase())+'</span>'+b+'</button>';
}

function cardHTML(it, catTitle){
  return '<article class="card">'
    + thumbHTML(it, catTitle)
    + '<div class="cbody">'
    + '<div class="product-head"><h3>'+esc(it.n)+'</h3><span class="price">'+money(it.p)+'</span></div>'
    + (it.d?'<p class="desc">'+esc(it.d)+'</p>':'<p class="desc"></p>')
    + '<div class="badges">'+badgeHTML(it.b)+'</div>'
    + '<div class="cfoot"><button class="det" data-det="'+it.id+'">Ver detalhes +</button></div>'
    + '<button class="add" data-add="'+it.id+'" aria-label="Adicionar '+esc(it.n)+' ao carrinho">+ Adicionar</button>'
    + '</div></article>';
}

/* ---------- montagem (mesma lógica de antes) ---------- */
function builderHTML(s){
  let h = '<div class="builder" data-builder="'+s.id+'">'
    + '<div class="bhero">'+(IMG[s.img]?'<img src="'+IMG[s.img]+'" alt="'+esc(s.title)+'" loading="lazy" decoding="async">':'')
    + '<div><h3>'+esc(s.title)+'</h3><p>'+esc(s.sub||'')+'</p></div></div>';
  s.steps.forEach((st,si)=>{
    h += '<div class="bstep"><div class="lb"><b>'+esc(st.label)+'</b><i data-cnt="'+s.id+'-'+si+'">0/'+(st.max>90?'livre':st.max)+'</i></div><div class="opts">';
    st.options.forEach((op,oi)=>{
      h += '<button class="opt" data-b="'+s.id+'" data-step="'+si+'" data-opt="'+oi+'">' + esc(op.name)
         + (op.price!==undefined&&op.price!==null?' <small>'+money(op.price)+'</small>':'')
         + (op.note?' <small>'+esc(op.note)+'</small>':'')
         + (op.badge==='sea'?' <span class="sea">'+fish+'</span>':'') + '</button>';
    });
    h += '</div></div>';
  });
  h += '<div class="bfoot"><div class="btot" data-tot="'+s.id+'">'+money(0)+'<small>total da montagem</small></div>'
     + '<button class="add" data-addbuild="'+s.id+'">+ Adicionar ao pedido</button></div>';
  if(s.note) h += '<div class="bstep"><p class="desc" style="margin:0">'+esc(s.note)+'</p></div>';
  h += '</div>';
  return h;
}

/* ---------- uma categoria por vez ---------- */
const nav = document.getElementById('nav');
const main = document.getElementById('main');
const q = document.getElementById('q');
const qclr = document.getElementById('qclr');
let activeCat = null;

nav.innerHTML = SECTIONS.map(s=>'<button class="chip" data-cat="'+s.id+'">'+esc(s.title)+'</button>').join('');

function setChips(id){
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.cat===id));
}

function catHTML(s){
  let cnt = '';
  if(s.kind==='cards'){
    const n = (s.items||[]).length;
    cnt = n + (n===1?' item':' itens');
  } else if(s.kind==='builder'){
    cnt = 'monte do seu jeito';
  }
  let h = '<div class="cathead"><h2>'+esc(s.title)+'</h2>'
        + (s.sub?'<p>'+esc(s.sub)+'</p>':'')
        + (cnt?'<span class="count">'+cnt+'</span>':'')
        + '</div>';
  if(s.kind==='cards'){
    h += '<div class="grid">'+s.items.map(it=>cardHTML(it,s.title)).join('')+'</div>';
  } else {
    h += builderHTML(s);
  }
  return h;
}

function renderCat(id){
  const s = SECTIONS.find(x=>x.id===id);
  if(!s) return;
  activeCat = id;
  setChips(id);
  main.innerHTML = catHTML(s);
  if(s.kind==='builder') syncBuilder(s);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- busca (procura em todas as categorias) ---------- */
let qt = null;
q.addEventListener('input',()=>{
  qclr.style.display = q.value ? 'block' : 'none';
  clearTimeout(qt);
  qt = setTimeout(()=>doSearch(q.value.trim()), 180);
});
qclr.addEventListener('click',()=>{ q.value=''; qclr.style.display='none'; doSearch(''); });

function doSearch(term){
  if(term.length<2){
    renderCat(activeCat || SECTIONS[0].id);
    return;
  }
  const t = term.toLowerCase();
  const hits = [];
  SECTIONS.forEach(s=>(s.items||[]).forEach(it=>{
    if(((it.n||'')+' '+(it.d||'')+' '+s.title).toLowerCase().indexOf(t) >= 0) hits.push({it:it, cat:s.title});
  }));
  setChips(null);
  main.innerHTML = '<div class="cathead"><h2>Resultados</h2><p>Buscando por \u201c'+esc(term)+'\u201d</p>'
    + '<span class="count">'+hits.length+(hits.length===1?' item encontrado':' itens encontrados')+'</span></div>'
    + (hits.length
       ? '<div class="grid">'+hits.map(h=>cardHTML(h.it,h.cat)).join('')+'</div>'
       : '<div class="empty">Nenhum produto encontrado. Tente outro termo, como \u201cfrango\u201d ou \u201csuco\u201d.</div>');
}

let detailRequestSequence = 0;
let overlayScrollPosition = 0;

function lockOverlayScroll(){
  if(document.body.classList.contains('overlay-open')) return;
  overlayScrollPosition = window.scrollY || window.pageYOffset || 0;
  document.documentElement.classList.add('overlay-open');
  document.body.classList.add('overlay-open');
  document.body.style.top = '-'+overlayScrollPosition+'px';
}
function unlockOverlayScroll(){
  const modalOpen = document.getElementById('modal').classList.contains('on');
  const drawerOpen = document.getElementById('drawer').classList.contains('on');
  if(modalOpen || drawerOpen) return;
  document.documentElement.classList.remove('overlay-open');
  document.body.classList.remove('overlay-open');
  document.body.style.top = '';
  window.scrollTo(0,overlayScrollPosition);
}
function filenameSlug(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function productVideoPaths(item){
  const category=VIDEO_CATEGORY_NAMES[item.sec]||filenameSlug(item.sec);
  let product=filenameSlug(item.n);
  if(category && product.startsWith(category+'-')) product=product.slice(category.length+1);
  const bases=[category+'-'+product];
  if(product && !product.startsWith('de-')) bases.push(category+'-de-'+product);
  bases.push(product,item.id);
  const names=[...new Set(bases)].flatMap(base=>[base+'.mp4',base+'.mov']);
  return [...new Set(names)].map(name=>'./'+encodeURIComponent(name));
}
function findProductVideo(id,paths,index,poster,request,modal){
  if(index>=paths.length || !window.fetch) return;
  const path=paths[index];
  fetch(path+'?probe='+Date.now(),{method:'HEAD',cache:'no-store'})
    .then(response=>{
      if(request!==detailRequestSequence || !modal.classList.contains('on')) return;
      if(response.ok) showProductVideo(id,path,poster);
      else findProductVideo(id,paths,index+1,poster,request,modal);
    })
    .catch(()=>findProductVideo(id,paths,index+1,poster,request,modal));
}
function fallbackVideoToImage(video,id){
  if(!video || !video.isConnected) return;
  const item=byId[id];
  if(!item) return;
  const src=IMG[item.img] || (item.simg && IMG[item.simg]) || '';
  const image=document.createElement('img');
  image.className='mimg';
  image.src=src;
  image.alt=item.n;
  const sound=document.querySelector('#mbody .video-sound');
  if(sound) sound.remove();
  video.replaceWith(image);
  document.getElementById('modal').classList.remove('video-detail');
}
function showProductVideo(id,path,poster){
  const mbody=document.getElementById('mbody');
  const image=mbody.querySelector('.mimg');
  if(!image) return;
  const modal=document.getElementById('modal');
  const video=document.createElement('video');
  video.className='mvideo';
  video.autoplay=true;
  video.muted=true;
  video.loop=true;
  video.playsInline=true;
  video.preload='auto';
  if(poster) video.poster=poster;
  video.setAttribute('aria-label','Vídeo do produto '+(byId[id]?.n||''));
  video.addEventListener('error',()=>fallbackVideoToImage(video,id),{once:true});
  const source=document.createElement('source');
  source.src=path;
  source.type=path.toLowerCase().endsWith('.mov')?'video/quicktime':'video/mp4';
  video.appendChild(source);
  image.replaceWith(video);
  modal.classList.add('video-detail');
  const sound=document.createElement('button');
  sound.className='video-sound';
  sound.type='button';
  sound.textContent='Ativar som';
  sound.setAttribute('aria-pressed','false');
  sound.setAttribute('aria-label','Ativar som do vídeo');
  sound.addEventListener('click',toggleVideoSound);
  video.after(sound);
  video.load();
  const playback=video.play();
  if(playback && playback.catch) playback.catch(()=>{});
}
function openDetail(id){
  const it = byId[id];
  if(!it) return;
  const request=++detailRequestSequence;
  const src = IMG[it.img] || (it.simg && IMG[it.simg]) || '';
  const poster = it.id === 'cz-carne-sol' ? CUSCUZ_VIDEO_POSTER : src;
  const modal=document.getElementById('modal');
  modal.classList.remove('video-detail');
  document.getElementById('mbody').innerHTML =
      (src?'<img class="mimg" src="'+src+'" alt="'+esc(it.n)+'">':'<div class="mimg"></div>')
    + '<button class="mx" onclick="closeDetail()" aria-label="Fechar">&times;</button>'
    + '<div class="mwrap"><p class="mcat">'+esc(CAT_OF[it.id]||'')+'</p>'
    + '<h2>'+esc(it.n)+'</h2>'
    + '<div class="badges">'+badgeHTML(it.b)+'</div>'
    + (it.d?'<p class="desc">'+esc(it.d)+'</p>':'')
    + '<div class="mprice"><span class="price">'+money(it.p)+'</span>'
    + '<button class="add" data-add="'+it.id+'" data-close="1">+ Adicionar ao pedido</button></div></div>';
  lockOverlayScroll();
  modal.classList.add('on');
  document.getElementById('dmask').classList.add('on');

  // Prioriza <id-do-produto>.mp4; usa o nome antigo apenas como alternativa.
  findProductVideo(it.id,productVideoPaths(it),0,poster,request,modal);
}
function toggleVideoSound(){
  const video=document.querySelector('#mbody .mvideo');
  const button=document.querySelector('#mbody .video-sound');
  if(!video||!button) return;
  video.muted=!video.muted;
  button.textContent=video.muted?'Ativar som':'Silenciar';
  button.setAttribute('aria-pressed',String(!video.muted));
  button.setAttribute('aria-label',video.muted?'Ativar som do vídeo':'Silenciar o vídeo');
}
function closeDetail(){
  ++detailRequestSequence;
  document.getElementById('modal').classList.remove('on');
  document.getElementById('modal').classList.remove('video-detail');
  document.getElementById('dmask').classList.remove('on');
  document.getElementById('mbody').replaceChildren(); // encerra o vídeo ao fechar
  unlockOverlayScroll();
}

/* ---------- carrinho ---------- */
const cart = [];

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1500);
}
function addLine(line){
  const key = line.key;
  const ex = cart.find(l=>l.key===key);
  if(ex) ex.qty++;
  else cart.push(Object.assign({qty:1},line));
  renderCart();
}
function count(){ return cart.reduce((a,l)=>a+l.qty,0); }
function total(){ return cart.reduce((a,l)=>a+l.qty*l.price,0); }
function renderCart(){
  const n = count(), t = total();
  const hc=document.getElementById('hcnt'), fc=document.getElementById('fcnt');
  hc.textContent=n; hc.classList.toggle('on',n>0);
  const fab=document.getElementById('fab');
  fab.classList.toggle('on',n>0);
  document.body.classList.toggle('has-cart',n>0);
  const narrow=window.matchMedia('(max-width:359px)').matches && cart.length>1;
  const shown=cart.slice(0,narrow?1:2);
  const summary=shown.map(l=>`${l.qty}× ${l.name}${l.opts?' · '+l.opts:''}`).join(' · ');
  const others=Math.max(0,cart.length-shown.length);
  const summaryText=summary+(others?` · +${others} ${others===1?'outro':'outros'}`:'');
  fc.textContent=`${n} ${n===1?'item':'itens'}`;
  document.getElementById('fabsummary').textContent=summaryText;
  document.getElementById('fabtotal').textContent=money(t);
  fab.setAttribute('aria-label',`Ver carrinho: ${n} ${n===1?'item':'itens'}, ${summaryText}, subtotal ${money(t)}`);
  document.querySelector('.cartbtn').setAttribute('aria-expanded',document.getElementById('drawer').classList.contains('on')?'true':'false');
  fab.setAttribute('aria-expanded',document.getElementById('drawer').classList.contains('on')?'true':'false');
  document.getElementById('dtot').textContent = money(t);
  const box=document.getElementById('ditems');
  if(!cart.length){ box.innerHTML='<div class="dempty">Seu carrinho está vazio.<br>Toque em \u201c+ Adicionar ao pedido\u201d nos pratos do cardápio.</div>'; return; }
  box.innerHTML = cart.map((l,i)=>{
    const im = IMG[l.img]||'';
    return '<div class="dit">'+(im?'<img class="im" src="'+im+'" alt="">':'<div class="im"></div>')
      +'<div class="in"><b>'+esc(l.name)+'</b>'+(l.opts?'<small>'+esc(l.opts)+'</small>':'')
      +'<span class="pp">'+money(l.price)+'</span></div>'
      +'<div class="qty"><button onclick="step('+i+',-1)" aria-label="menos">\u2212</button><span>'+l.qty+'</span>'
      +'<button onclick="step('+i+',1)" aria-label="mais">+</button></div></div>';
  }).join('');
}
function step(i,d){
  cart[i].qty += d;
  if(cart[i].qty<=0) cart.splice(i,1);
  renderCart();
}
function clearCart(){ cart.length=0; renderCart(); toast('Carrinho limpo'); }
let cartFocus=null;
function openCart(){
  lockOverlayScroll();
  cartFocus=document.activeElement;
  const drawer=document.getElementById('drawer');
  drawer.classList.add('on'); drawer.setAttribute('aria-hidden','false');
  document.getElementById('mask').classList.add('on'); document.body.classList.add('cart-open');
  document.querySelector('.cartbtn').setAttribute('aria-expanded','true');
  document.getElementById('fab').setAttribute('aria-expanded','true');
  document.getElementById('drawerClose').focus();
}
function closeCart(){
  const drawer=document.getElementById('drawer');
  drawer.classList.remove('on'); drawer.setAttribute('aria-hidden','true');
  document.getElementById('mask').classList.remove('on'); document.body.classList.remove('cart-open');
  document.querySelector('.cartbtn').setAttribute('aria-expanded','false');
  document.getElementById('fab').setAttribute('aria-expanded','false');
  unlockOverlayScroll();
  const target=cartFocus&&cartFocus.offsetParent!==null?cartFocus:document.querySelector('.cartbtn');
  if(target) target.focus();
}

function share(){
  if(!cart.length){ toast('Adicione itens antes de enviar'); return; }
  let txt = '*Rio Bistrô Saudável — Pedido*\n\n';
  cart.forEach(l=>{
    txt += '• '+l.qty+'x '+l.name+(l.opts?'\n   '+l.opts:'')+'\n   '+money(l.price*l.qty)+'\n';
  });
  txt += '\n*Total: '+money(total())+'*';
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}

/* ---------- montagem: estado e cálculo ---------- */
const state = {};
SECTIONS.filter(s=>s.kind==='builder').forEach(s=>{ state[s.id]=s.steps.map(()=>[]); });

function builderPrice(s){
  if(s.mode==='matrix'){
    const pr = s.steps[0] ? state[s.id][0].map(i=>s.steps[0].options[i].name) : [];
    const sz = s.steps[1] ? state[s.id][1].map(i=>s.steps[1].options[i].name) : [];
    if(pr.length && sz.length) return (s.matrix[pr[0]]||{})[sz[0]]||0;
    return 0;
  }
  let t=0;
  s.steps.forEach((st,si)=>state[s.id][si].forEach(oi=>{ t += st.options[oi].price||0; }));
  return t;
}
function builderOpts(s){
  return s.steps.map((st,si)=>{
    const names = state[s.id][si].map(oi=>st.options[oi].name);
    if(!names.length) return null;
    return st.label.split('·')[0].trim()+': '+names.join(', ');
  }).filter(Boolean).join(' · ');
}
function syncBuilder(s){
  const root = document.querySelector('[data-builder="'+s.id+'"]');
  if(!root) return;
  root.querySelectorAll('.opt').forEach(b=>{
    const si=+b.dataset.step, oi=+b.dataset.opt;
    b.classList.toggle('on', state[s.id][si].indexOf(oi) >= 0);
  });
  s.steps.forEach((st,si)=>{
    const el = root.querySelector('[data-cnt="'+s.id+'-'+si+'"]');
    if(el) el.textContent = state[s.id][si].length+'/'+(st.max>90?'livre':st.max);
  });
  const t = root.querySelector('[data-tot="'+s.id+'"]');
  if(t) t.innerHTML = money(builderPrice(s))+'<small>total da montagem</small>';
}
function addBuild(id){
  const s = SECTIONS.find(x=>x.id===id);
  const price = builderPrice(s);
  if(!price){ toast('Escolha as opções para ver o preço'); return; }
  const opts = builderOpts(s);
  addLine({key:id+'|'+opts, name:s.title, price:price, img:s.img||'', opts:opts});
}

/* ---------- cliques ---------- */
document.addEventListener('click',e=>{
  const chip = e.target.closest('[data-cat]');
  if(chip){ q.value=''; qclr.style.display='none'; renderCat(chip.dataset.cat); return; }

  const d = e.target.closest('[data-det]');
  if(d){ openDetail(d.dataset.det); return; }

  const a = e.target.closest('[data-add]');
  if(a){
    const it = byId[a.dataset.add];
    if(!it) return;
    addLine({key:it.id, name:it.n, price:it.p, img:it.img||it.simg||'', opts:''});
    if(a.dataset.close) closeDetail();
    return;
  }
  const ab = e.target.closest('[data-addbuild]');
  if(ab){ addBuild(ab.dataset.addbuild); return; }

  const o = e.target.closest('[data-b]');
  if(o){
    const s = SECTIONS.find(x=>x.id===o.dataset.b);
    const si = +o.dataset.step, oi = +o.dataset.opt, bstep = s.steps[si];
    const sel = state[s.id][si];
    const pos = sel.indexOf(oi);
    if(pos >= 0) sel.splice(pos,1);
    else{
      if(bstep.max===1) sel.length=0;
      if(sel.length>=bstep.max){ toast('Máximo de '+bstep.max+' nesta etapa'); return; }
      sel.push(oi);
    }
    syncBuilder(s);
    return;
  }
});

/* ---------- início ---------- */
document.getElementById('logo').src = IMG.LOGO || '';
document.getElementById('flogo').src = IMG.LOGO || '';
renderCat(SECTIONS[0].id);
window.addEventListener('resize',renderCart,{passive:true});
document.addEventListener('keydown',e=>{
  const drawer=document.getElementById('drawer');
  if(!drawer.classList.contains('on')) return;
  if(e.key==='Escape'){closeCart();return;}
  if(e.key==='Tab'){
    const buttons=[...drawer.querySelectorAll('button:not([disabled])')];
    const first=buttons[0],last=buttons[buttons.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
renderCart();
</script>
